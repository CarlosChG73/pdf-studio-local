
name: Publicar PDF Studio Local en GitHub Pages

on:
  push:
    branches: [mejoras]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar para GitHub Pages
        run: npm run build -- --base=/pdf-studio-local/

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos publicados
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar aplicación
        id: deployment
        uses: actions/deploy-pages@v4
