<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a56db" />
    <title>Proyecto PDF</title>
  </head>
  <body>
    <header class="app-header">
      <h1>Proyecto PDF</h1>
      <p class="app-subtitle">Consulta local de documentos</p>
    </header>

    <main id="app" class="app-main">
      <section class="toolbar" aria-label="Documento">
        <!-- Selección del documento PDF -->
        <label class="file-button" for="pdf-file">Seleccionar PDF</label>
        <input
          id="pdf-file"
          class="visually-hidden"
          type="file"
          accept=".pdf,application/pdf"
        />

        <div class="controls" role="group" aria-label="Navegación">
          <button id="prev-page" type="button" disabled aria-label="Página anterior">
            &#8249;
          </button>
          <input
            id="page-number"
            class="page-input"
            type="number"
            min="1"
            value="1"
            inputmode="numeric"
            aria-label="Número de página"
            disabled
          />
          <span id="page-total" class="page-total">de —</span>
          <button id="next-page" type="button" disabled aria-label="Página siguiente">
            &#8250;
          </button>
        </div>

        <div class="controls" role="group" aria-label="Zoom">
          <button id="zoom-out" type="button" disabled aria-label="Reducir">−</button>
          <span id="zoom-level" class="zoom-level">—</span>
          <button id="zoom-in" type="button" disabled aria-label="Ampliar">+</button>
          <button id="fit-width" type="button" disabled>Ajustar ancho</button>
          <button id="fit-page" type="button" disabled>Página completa</button>
        </div>

        <button id="copy-page" type="button" disabled>Copiar página</button>

        <div class="controls search-controls" role="group" aria-label="Búsqueda">
          <input
            id="search-input"
            class="search-input"
            type="search"
            placeholder="Buscar en el documento"
            aria-label="Buscar en el documento"
            autocomplete="off"
            disabled
          />
          <button id="match-prev" type="button" disabled aria-label="Coincidencia anterior">
            &#8593;
          </button>
          <span id="match-count" class="zoom-level">—</span>
          <button id="match-next" type="button" disabled aria-label="Coincidencia siguiente">
            &#8595;
          </button>
        </div>

        <!-- Estado del documento -->
        <p id="pdf-status" class="status" role="status">Ningún documento seleccionado.</p>
      </section>

      <!-- Área de visualización del PDF -->
      <section id="viewer" class="viewer" aria-label="Visor del documento">
        <canvas id="pdf-canvas">Visualización del documento PDF</canvas>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
