<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a56db" />
    <meta
      name="description"
      content="Lector local de PDF con navegación, búsqueda, selección de texto y OCR. Nada sale del dispositivo."
    />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Proyecto PDF</title>
  </head>
  <body>
    <header class="app-header">
      <button id="tools-toggle" type="button" aria-controls="tools-panel" aria-expanded="true" aria-label="Ocultar herramientas" title="Herramientas">
        <span aria-hidden="true">☰</span>
      </button>
      <h1>Proyecto PDF</h1>
      <div id="appearance-control" class="appearance-control">
        <button id="appearance-toggle" class="appearance-switch" type="button" role="switch" aria-checked="false" aria-label="Modo oscuro" title="Apariencia: Claro">
          <span class="appearance-track" aria-hidden="true">
            <span class="appearance-thumb"></span>
            <span class="appearance-symbol">☀</span>
            <span class="appearance-symbol">☾</span>
          </span>
        </button>
      </div>
    </header>

    <main id="app" class="app-main" data-tools-open="true">
      <aside id="tools-panel" class="toolbar tools-panel" aria-labelledby="tools-title">
        <div class="tools-heading">
          <h2 id="tools-title">Herramientas</h2>
          <button id="tools-close" type="button" aria-label="Cerrar herramientas" title="Cerrar herramientas">×</button>
        </div>
        <!-- Un único conjunto de controles para escritorio y móvil. -->
        <label class="file-button" for="pdf-file">Abrir PDF</label>
        <input
          id="pdf-file"
          class="visually-hidden"
          type="file"
          accept=".pdf,application/pdf"
        />

        <div class="controls" role="group" aria-label="Navegación">
          <button id="prev-page" type="button" disabled aria-label="Página anterior">
            &#8249;
          </button>
          <input
            id="page-number"
            class="page-input"
            type="number"
            min="1"
            value="1"
            inputmode="numeric"
            aria-label="Número de página"
            disabled
          />
          <span id="page-total" class="page-total">de —</span>
          <button id="next-page" type="button" disabled aria-label="Página siguiente">
            &#8250;
          </button>
        </div>

        <div class="controls" role="group" aria-label="Zoom">
          <button id="zoom-out" type="button" disabled aria-label="Reducir">−</button>
          <span id="zoom-level" class="zoom-level">—</span>
          <button id="zoom-in" type="button" disabled aria-label="Ampliar">+</button>
          <button id="fit-width" type="button" disabled aria-label="Ajustar ancho" title="Ajustar ancho">Ancho</button>
          <button id="fit-page" type="button" disabled aria-label="Página completa" title="Página completa">Página</button>
        </div>

        <div class="controls document-actions" role="group" aria-label="Texto y reconocimiento">
          <button id="copy-page" type="button" disabled>Copiar texto</button>
          <button id="ocr-page" type="button" disabled>Reconocer página</button>
        </div>

        <div class="controls search-controls" role="group" aria-label="Búsqueda">
          <input
            id="search-input"
            class="search-input"
            type="search"
            placeholder="Buscar en el documento"
            aria-label="Buscar en el documento"
            autocomplete="off"
            disabled
          />
          <button id="match-prev" type="button" disabled aria-label="Coincidencia anterior">
            &#8593;
          </button>
          <span id="match-count" class="zoom-level">—</span>
          <button id="match-next" type="button" disabled aria-label="Coincidencia siguiente">
            &#8595;
          </button>
        </div>

        <p id="pdf-status" class="status" role="status">Ningún documento seleccionado.</p>
        <div id="auxiliary-hints" class="control-hints auxiliary-hints"></div>
      </aside>

      <!-- Resultado del OCR de la página actual -->
      <section
        id="ocr-panel"
        class="ocr-panel"
        aria-labelledby="ocr-title"
        hidden
      >
        <div class="ocr-header">
          <h2 id="ocr-title">Texto reconocido</h2>
          <span id="ocr-meta" class="ocr-meta"></span>
        </div>
        <p id="ocr-message" class="ocr-message" role="status"></p>
        <progress id="ocr-progress" class="ocr-progress" max="100" value="0"></progress>
        <textarea
          id="ocr-text"
          class="ocr-text"
          readonly
          spellcheck="false"
          aria-label="Texto reconocido de la página"
          hidden
        ></textarea>
        <div class="ocr-actions">
          <button id="ocr-copy" type="button" disabled>Copiar texto</button>
          <button id="ocr-discard" type="button" disabled>Descartar</button>
        </div>
      </section>

      <!-- Visor del documento -->
      <section id="viewer" class="viewer" aria-label="Visor del documento">
        <div id="pdf-page" class="page">
          <canvas id="pdf-canvas">Visualización del documento PDF</canvas>
          <div id="text-layer-host" class="text-layer-host"></div>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
